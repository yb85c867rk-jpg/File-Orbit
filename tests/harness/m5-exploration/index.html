  .create-map-drop { border: 1px dashed var(--fo-border-strong); border-radius: 7px; padding: 12px; color: var(--fo-muted); font-size: 12px; text-align: center; }

.create-map-location-label { margin-top: 2px; color: var(--fo-text); font-size: 12px; font-weight: 600; }
.create-map-location { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
.create-map-location-name { flex: 1 1 180px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fo-muted); font-size: 12px; }
.create-map-location button { background: var(--fo-panel-2); color: var(--fo-text); border: 1px solid var(--fo-border-strong); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.create-map-location button:focus-visible { outline: 2px solid var(--fo-accent); outline-offset: 1px; }
.create-map-location button:disabled { opacity: .55; cursor: default; }
.create-map-location button[aria-pressed="true"] { border-color: var(--fo-accent); }
.create-map-location-note { color: var(--fo-muted); font-size: 11px; line-height: 1.35; }
  .create-map-preview { max-height: 240px; overflow: auto; border: 1px solid var(--fo-border); border-radius: 6px; padding: 5px; font-size: 12px; }
  .create-map-row { display: flex; gap: 6px; min-height: 22px; align-items: center; overflow-wrap: anywhere; }
  .create-map-status { min-height: 16px; color: var(--fo-muted); font-size: 12px; overflow-wrap: anywhere; }

  .create-map-actions { display: flex; justify-content: flex-end; gap: 7px; }

  .create-map-confirm { display: grid; gap: 10px; }
  .create-map-confirm[hidden] { display: none; }
  :root[data-theme="light"] .create-map-status[data-kind="error"] { color: #b91c1c; }
  :root[data-theme="light"] .create-map-status[data-kind="ok"] { color: #047857; }

  .permission-dialog-backdrop[hidden] { display: none !important; pointer-events: none; visibility: hidden; }
.permission-dialog-actions button { min-height: 34px; padding: 5px 12px; border: 1px solid var(--fo-border-strong); border-radius: 6px; background: var(--fo-panel-2); color: var(--fo-text); font: inherit; font-size: 12px; cursor: pointer; }
.permission-dialog-actions button:focus-visible { outline: 2px solid var(--fo-accent); outline-offset: 2px; }
.embed-dialog-backdrop { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 16px; background: rgba(2,6,23,.62); }
  .embed-dialog { width: min(620px, 100%); max-height: min(86dvh, 720px); overflow: auto; background: var(--fo-panel); color: var(--fo-text); border: 1px solid var(--fo-border-strong); border-radius: 10px; box-shadow: 0 24px 70px rgba(0,0,0,.45); }

  .embed-dialog-copy { display: grid; gap: 10px; padding: 14px; font-size: 13px; line-height: 1.45; }

 <div id="graph-wrap">
