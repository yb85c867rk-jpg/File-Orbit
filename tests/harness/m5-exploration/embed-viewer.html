<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileOrbit embed preview</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --panel:#111827; --text:#e5e7eb; --muted:#94a3b8; --border:#334155; --input:#1f2937; --red:#E74C3C; }
  :root[data-theme="light"] { color-scheme: light; --bg:#f8fafc; --panel:#ffffff; --text:#0f172a; --muted:#475569; --border:#cbd5e1; --input:#ffffff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden; }
  #embed-app { display:grid; grid-template-rows:auto auto minmax(0,1fr); height:100%; min-height:320px; }
  #embed-header { display:flex; align-items:center; gap:10px; min-width:0; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
  #embed-header strong { font-size:15px; white-space:nowrap; }
  #embed-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:13px; }
  #embed-readonly { margin-left:auto; color:var(--muted); font-size:11px; white-space:nowrap; }
  #embed-toolbar { display:flex; gap:6px; align-items:center; min-width:0; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel); }
  #embed-search { width:min(280px, 55vw); height:30px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); font:inherit; }
  #embed-clear, #embed-back { height:30px; padding:3px 9px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
  #embed-clear[hidden], #embed-back[hidden], #embed-results[hidden], #embed-notice[hidden] { display:none; }
  #embed-status { margin-left:auto; color:var(--muted); font-size:11px; }
  #embed-stage { position:relative; min-height:0; overflow:hidden; background:var(--bg); }
  #embed-canvas-host, #embed-label-host { position:absolute; inset:0; }
  #embed-canvas-host canvas { display:block; width:100%; height:100%; }
  #embed-label-host { pointer-events:none; }
  #embed-results { position:absolute; z-index:4; right:12px; top:12px; width:min(300px, calc(100% - 24px)); max-height:min(55vh, 340px); overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .embed-result { display:flex; flex-direction:column; gap:2px; width:100%; padding:7px 8px; border:0; border-radius:5px; background:transparent; color:var(--text); text-align:left; font:inherit; cursor:pointer; }
  .embed-result:hover, .embed-result:focus-visible { background:var(--input); outline:2px solid #818cf8; }
  .embed-result strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .embed-result span, .embed-result-empty { color:var(--muted); font-size:11px; }
  .embed-result-empty { margin:4px 6px; }
  #embed-notice { position:absolute; z-index:3; left:12px; bottom:12px; max-width:min(520px, calc(100% - 24px)); padding:6px 9px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--muted); font-size:11px; pointer-events:none; }
  #embed-notice[data-kind="error"] { border-color:#f87171; color:#fecaca; }
  @media (max-width:560px) { #embed-header { align-items:flex-start; flex-wrap:wrap; padding:8px 10px; } #embed-title { flex-basis:100%; order:3; } #embed-readonly { margin-left:auto; } #embed-toolbar { flex-wrap:wrap; padding:7px 8px; } #embed-search { width:calc(100% - 46px); } #embed-status { flex-basis:100%; margin-left:0; } #embed-results { left:8px; right:8px; top:8px; width:auto; } }
</style>
</head>
<body>
<div id="embed-app">
  <header id="embed-header"><strong>FileOrbit</strong><span id="embed-title">Loading preview…</span><span id="embed-readonly">Read-only</span></header>
  <div id="embed-toolbar">
    <input id="embed-search" type="search" placeholder="Search this map" aria-label="Search this embedded map" autocomplete="off" disabled>
    <button id="embed-clear" type="button">Clear</button>
    <button id="embed-back" type="button" hidden>Back</button>
    <span id="embed-status" role="status" aria-live="polite">Waiting for snapshot…</span>
  </div>
  <main id="embed-stage" aria-label="Read-only FileOrbit map">
    <div id="embed-canvas-host"></div>
    <div id="embed-label-host"></div>
    <div id="embed-results" role="region" aria-label="Search results" hidden></div>
    <div id="embed-notice" role="status" aria-live="polite" hidden></div>
  </main>
</div>
<script>
  (() => {
    const report = (message) => {
      const status = document.querySelector('#embed-status');
      if (status) status.textContent = 'Preview error';
    };
    window.addEventListener('error', (event) => report(event.message || 'Module failed to load'));
    window.addEventListener('unhandledrejection', (event) => report(event.reason?.message || event.reason || 'Unhandled rejection'));
  })();
</script>
<script type="module" src="./embed-viewer.mjs"></script>
</body>
</html>
