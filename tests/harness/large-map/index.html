<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileOrbit large-map prototype</title><style>body{font:14px system-ui;margin:0;background:#0f172a;color:#e2e8f0}header{background:#1e293b;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:300px 1fr 260px;gap:8px;padding:8px}section{background:#111c2e;border:1px solid #334155;border-radius:8px;padding:8px;min-width:0}button{background:#1e3a5f;color:#e2e8f0;border:1px solid #475569;border-radius:5px;padding:4px 7px;margin:2px;cursor:pointer}.item{display:block;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#items{max-height:420px;overflow:auto}#lod{position:relative;height:620px;background:#020617;overflow:hidden}.lods{position:relative;width:100%;height:620px;overflow:hidden}#results{max-height:150px;overflow:auto}img{max-width:180px}</style></head><body><header><b>FileOrbit large-map prototype (test entry, not paid activation)</b><label>Shape <select id="shape"><option>flat</option><option>wide</option><option>balanced</option><option>mixed</option><option>deep</option></select></label><label>Nodes <select id="count"><option>300</option><option>1000</option></select></label><button id="mount">Mount</button><button id="unmount">Unmount</button><span id="status">Ready</span></header><main><section><div id="crumbs"></div><div id="items"></div><button id="prev">Prev</button><button id="next">Next</button><div id="page"></div><div id="details"></div></section><section><div id="lod"></div></section><section><form id="search-form"><input name="q" placeholder="Search"><button>Search</button></form><div id="search-info"></div><div id="results"></div><button id="preview">Preview selected</button><div id="preview-output"></div></section></main><script type="module" src="./app.mjs"></script></body></html>
