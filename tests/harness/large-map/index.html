<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileOrbit 20-category graph prototype</title><style>body{font:14px system-ui;margin:0;background:#0f172a;color:#e2e8f0}header{background:#1e293b;padding:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:1fr 310px;gap:8px;padding:8px}section{background:#111c2e;border:1px solid #334155;border-radius:8px;padding:8px;min-width:0}button{background:#1e3a5f;color:#e2e8f0;border:1px solid #475569;border-radius:5px;padding:4px 7px;margin:2px;cursor:pointer}button:disabled{opacity:.45;cursor:default}#graph{width:100%;height:650px;display:block;background:#020617;touch-action:none;cursor:grab}#crumbs{display:flex;flex-wrap:wrap;margin:4px 0}#focus{color:#94a3b8;font-size:12px}#results{max-height:170px;overflow:auto}#preview-output embed{width:260px;height:190px;border:0}#preview-output iframe{width:260px;height:100px;border:0}img{max-width:160px}label{font-size:12px}</style></head><body><header><b>FileOrbit 그래프 탐색 프로토타입</b><label>샘플 <select id="fixture"><option value="20-categories">20개 카테고리 · depth 3–7</option><option value="flat">flat 300</option><option value="wide">wide 300</option><option value="balanced">balanced 300</option><option value="mixed">mixed 300</option><option value="deep">deep 300</option><option value="pureflat">pure flat (no folders)</option><option value="flat-1000">flat 1,000 (test)</option><option value="deep-1000">deep 1,000 (test)</option></select></label><label>Context <select id="context"><option value="free">free</option><option value="paid">paid-test</option></select></label><label>Nodes <select id="count"><option>299</option><option selected>300</option><option>301</option><option>999</option><option>1000</option><option>1001</option></select></label><button id="mount">Load</button><button id="unmount">Unload</button><button id="back">뒤로</button><button id="root-button">루트로</button><button id="zoom-in">+</button><button id="zoom-out">−</button><button id="fit">Fit</button><span id="status">Ready</span></header><main><section><div id="focus"></div><div id="crumbs"></div><canvas id="graph"></canvas></section><section><form id="search-form"><input name="q" placeholder="파일명 검색"><button>검색</button></form><div id="search-info"></div><div id="results"></div><button id="search-prev">이전 결과</button><button id="search-next">다음 결과</button><button id="search-clear">검색 지우기</button><div id="selection">No file selected</div><button id="preview">미리보기</button><div id="preview-output"></div><p style="font-size:12px;color:#94a3b8">300개 이하는 전체 지도, 300개 초과는 폴더 개요입니다. 폴더를 클릭하면 전체 개요 위에 선택 하위 트리가 밝게 펼쳐집니다. 파일 클릭은 선택/미리보기만 합니다. 휠 확대/축소, 배경 드래그, +/−/Fit, 뒤로/루트로를 지원합니다.</p></section></main><script type="module" src="./app.mjs"></script></body></html>
