<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M5 Desktop Navigation</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #10131a; color: #d9deea; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 20px; font-weight: 600; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    button, select { background: #1d2635; color: inherit; border: 1px solid #39465c; border-radius: 6px; padding: 6px 10px; }
    #graph-host {
      position: relative; width: 100%; height: min(68vh, 640px); min-height: 280px;
      border: 1px solid #39465c; background: #0b0e14; overflow: hidden;
    }
    #graph-host canvas { position: absolute; left: 0; top: 0; }
    #status { white-space: pre-wrap; background: #151b25; border: 1px solid #2b3648; padding: 12px; border-radius: 6px; max-height: 520px; overflow: auto; }
    .muted { color: #8f9bb0; }
  </style>
</head>
<body>
<main>
  <h1>M5 Adaptive Layout Comparison <span style="color:#a5b4fc">EXPERIMENTAL</span></h1>
  <p class="muted">Compare legacy baseline and an opt-in density-aware layout. Mouse navigation only; no touch, keyboard, inertia, opening, previews, search, or auto focus.</p>
  <div class="toolbar">
    <label>Fixture <select id="fixture"><option value="f20">F20</option><option value="f200">F200</option><option value="crowdedFolder">Crowded folder</option><option value="denseNeighbors">Dense neighbors</option><option value="mixedDeepWide">Mixed deep/wide</option><option value="longLabels">Long labels</option><option value="infeasible">Infeasible depth</option></select></label>
    <label>Layout <select id="mode"><option value="baseline">Baseline</option><option value="v1">Experimental v1</option><option value="v2">Experimental v2</option></select></label>
    <label>Refine v2 <input id="refine-v2" type="checkbox"></label>
    <label>Correction <select id="correction-mode"><option value="off">Off</option><option value="local">Local experimental</option><option value="global">Existing global experimental</option></select></label>
    <label>Labels <select id="label-policy"><option value="around">around</option><option value="legacy">legacy</option></select></label>
    <label>Presentation <select id="presentation"><option value="fixed6">fixed 6 CSS px</option><option value="native">native</option></select></label>
    <label>Phase <select id="phase"><option value="current">current</option><option value="start">start</option><option value="end">end</option></select></label>
    <label>minStep <input id="min-step" type="number" min="0.0001" max="0.25" step="0.005" value="0.01" style="width:80px"></label>
    <label>flex <input id="radial-flex" type="number" min="0" max="1" step="0.05" value="0.65" style="width:65px"></label>
    <label>branch <input id="branch-weight" type="number" min="0" max="10" step="0.05" value="0.75" style="width:65px"></label>
    <label>compress <input id="demand-compression" type="number" min="0.05" max="1" step="0.05" value="0.6" style="width:65px"></label>
    <label>bands <input id="band-count" type="number" min="1" max="4" step="1" value="2" style="width:50px"></label>
    <label>DPR <select id="dpr-source"><option value="actual">actual</option><option value="1">synthetic 1</option><option value="1.25">synthetic 1.25</option><option value="2">synthetic 2</option><option value="3">synthetic 3</option></select></label>
    <button id="zoom-in" type="button">Zoom in</button>
    <button id="zoom-out" type="button">Zoom out</button>
    <button id="fit-graph" type="button">Fit graph</button>
    <button id="reset-camera" type="button">Reset camera</button>
    <button id="focus-selected" type="button">Focus selected</button>
    <button id="reset-focus" type="button">Reset focus</button>
    <button id="clear" type="button">Clear selection</button>
    <button id="apply-layout" type="button">Apply layout</button>
    <button id="resize" type="button">Resize</button>
    <button id="recreate" type="button">Recreate</button>
    <button id="destroy" type="button">Destroy</button>
  </div>
  <div id="graph-host"></div>
  <h2 style="font-size:16px;margin-top:18px;">Comparison metrics</h2>
  <pre id="metrics"></pre>
  <h2 style="font-size:16px;margin-top:18px;">Machine-readable status</h2>
  <pre id="status"></pre>
</main>
<script type="module" src="./main.mjs"></script>
</body>
</html>
